<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f6f2"><title>式典資材管理 TEST</title></head><body style="margin:0;background:#f7f6f2;font-family:-apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif;color:#1d2925"><main style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center"><div><div style="font-weight:700;font-size:20px">正在開啟式典資材管理…</div><div style="margin-top:8px;color:#64716c;font-size:14px">第一次使用會請你輸入姓名，之後這台裝置會自動辨識。</div></div></main><script>
(function(){
  const KEY='ceremonyAssetDeviceTokenV7860';
  const qs=new URLSearchParams(location.search);
  if(qs.get('resetIdentity')==='1'){try{localStorage.removeItem(KEY)}catch(e){}}
  function freshToken(){const b=new Uint8Array(32);crypto.getRandomValues(b);return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('')}
  let token='';try{token=(localStorage.getItem(KEY)||'').toLowerCase()}catch(e){}
  if(!/^[a-f0-9]{64}$/.test(token)){token=freshToken();try{localStorage.setItem(KEY,token)}catch(e){}}
  const form=document.createElement('form');form.method='post';form.action='https://script.google.com/macros/s/AKfycbzm_wjsjBPITntljnOhUo-lXkAS5gTVXMpk_YFU9SjOBYwiWJVsZ0owje6a5LZb_jMO9g/exec';form.style.display='none';
  const input=document.createElement('input');input.type='hidden';input.name='deviceToken';input.value=token;form.appendChild(input);
  document.body.appendChild(form);form.submit();
})();
</script></body></html>
